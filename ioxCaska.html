<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IOX Control</title>
</head>
<body>

  <h1>IOX Intervención del Acelerador</h1>

  <select id="deviceSelect"></select>
  <select id="stateSelect">
    <option value="true">ON</option>
    <option value="false">OFF</option>
  </select>
  <button id="sendBtn">Send</button>

  <script>
    geotab.addin.ioxOutput = function (api, state) {

      return {

        initialize: function (api, state, callback) {

          const deviceSelect = document.getElementById("deviceSelect");
          const stateSelect = document.getElementById("stateSelect");
          const sendBtn = document.getElementById("sendBtn");

          // Cargar dispositivos
          api.call("Get", { typeName: "Device" }, function (devices) {

            devices.forEach(function (device) {
              const opt = document.createElement("option");
              opt.value = device.id;
              opt.textContent = device.name;
              deviceSelect.appendChild(opt);
            });

            callback();

          }, function (error) {
            console.error(error);
            callback(error);
          });

          // 🔥 CONTROL REAL DEL IOX
          sendBtn.onclick = function () {

            const deviceId = deviceSelect.value;
            const stateValue = stateSelect.value === "true";

            api.call("Add", {
              typeName: "GoDeviceCommand",
              entity: {
                device: { id: deviceId },
                commandType: "OutputControl",
                data: {
                  outputs: [
                    {
                      id: 1,
                      value: stateValue
                    }
                  ]
                }
              }
            }, function () {
              alert("Relevador activado/desactivado");
            }, function (error) {
              console.error(error);
              alert("Error al controlar IOX");
            });
          };
        },

        focus: function () {},
        blur: function () {}

      };
    };
  </script>

</body>
</html>
