<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IOX Caska</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .header {
            background: #e6f2ff;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 12px;
        }
        select, button {
            margin-right: 10px;
        }
        .log {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <strong>CASKA ADD-IN TOOL</strong><br>
        Esta herramienta demuestra el control del IOX Output mediante Geotab.
    </div>

    <h1>IOX Caska</h1>

    <p>
        Seleccione un vehículo y el estado del IOX, luego presione "Send"
        para enviar el comando al dispositivo.
    </p>

    <select id="deviceSelect"></select>

    <select id="stateSelect">
        <option value="On">On</option>
        <option value="Off">Off</option>
    </select>

    <button id="sendBtn">Send</button>

    <div class="log" id="log"></div>

    <script>
        geotab.addin.ioxOutput = function (api, state) {

            return {

                initialize: function (api, state, callback) {

                    var deviceSelect = document.getElementById("deviceSelect");
                    var stateSelect = document.getElementById("stateSelect");
                    var sendBtn = document.getElementById("sendBtn");
                    var log = document.getElementById("log");

                    // Obtener dispositivos
                    api.call("Get", { typeName: "Device" }, function (devices) {

                        devices.forEach(function (device) {
                            var option = document.createElement("option");
                            option.value = device.id;
                            option.textContent = device.name;
                            deviceSelect.appendChild(option);
                        });

                        callback();

                    }, function (error) {
                        console.error(error);
                        callback(error);
                    });

                    // 👇 ESTE ES EL CAMBIO REAL IMPORTANTE
                    sendBtn.onclick = function () {

                        var deviceId = deviceSelect.value;
                        var stateValue = stateSelect.value;

                        api.call("Add", {
                            typeName: "TextMessage",
                            entity: {
                                device: { id: deviceId },
                                driver: { id: "UnknownDriverId" },
                                isDirectionToVehicle: true,
                                messageContent: {
                                    contentType: "DriverDisplay",
                                    text: stateValue
                                }
                            }
                        }, function () {

                            var now = new Date();
                            var entry = document.createElement("div");
                            entry.textContent = "Sent: " + now.toString();
                            log.appendChild(entry);

                        }, function (error) {
                            console.error(error);
                            alert("Error al enviar");
                        });
                    };
                },

                focus: function () {},
                blur: function () {}

            };
        };
    </script>

</body>
</html>
