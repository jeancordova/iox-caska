<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IOX Caska</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            margin-bottom: 10px;
        }
        select, button {
            margin-right: 10px;
        }
        .log {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>CASKA ADD-IN TOOL</h2>

    <p>
        Esta herramienta demuestra el control del IOX Output mediante Geotab.
    </p>

    <h1>IOX Caska</h1>

    <p>
        Seleccione un vehículo y el estado del IOX, luego presione "Send"
        para activar o desactivar el relevador.
    </p>

    <select id="deviceSelect"></select>

    <select id="stateSelect">
        <option value="true">On</option>
        <option value="false">Off</option>
    </select>

    <button id="sendBtn">Send</button>

    <div class="log" id="log"></div>

    <script>
        geotab.addin.ioxOutput = function (api, state) {

            return {

                initialize: function (api, state, callback) {

                    const deviceSelect = document.getElementById("deviceSelect");
                    const stateSelect = document.getElementById("stateSelect");
                    const sendBtn = document.getElementById("sendBtn");
                    const log = document.getElementById("log");

                    // Cargar dispositivos
                    api.call("Get", { typeName: "Device" }, function (devices) {

                        devices.forEach(function (device) {
                            const opt = document.createElement("option");
                            opt.value = device.id;
                            opt.textContent = device.name;
                            deviceSelect.appendChild(opt);
                        });

                        callback();

                    }, function (error) {
                        console.error(error);
                        callback(error);
                    });

                    // Enviar comando (igual que sample)
                    sendBtn.onclick = function () {

                        const deviceId = deviceSelect.value;
                        const stateValue = stateSelect.value === "true";

                        api.call("Add", {
                            typeName: "TextMessage",
                            entity: {
                                device: { id: deviceId },
                                messageContent: {
                                    contentType: "DriverDisplay",
                                    text: stateValue ? "IOX ON" : "IOX OFF"
                                }
                            }
                        }, function () {

                            const now = new Date();
                            const entry = document.createElement("div");
                            entry.textContent = "Sent: " + now.toString();
                            log.appendChild(entry);

                        }, function (error) {
                            console.error(error);
                            alert("Error al enviar");
                        });
                    };
                },

                focus: function () {},
                blur: function () {}

            };
        };
    </script>

</body>
</html>
