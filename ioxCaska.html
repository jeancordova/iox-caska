<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IOXffff Caska</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    .title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="title">IOX Caska</div>

  <p>This Add-In demonstrates the capabilities of the IOX-OUTPUT.</p>
  <p>Select a vehicle and IOX state and then hit "send" to send a message to the device.</p>

  <select id="deviceSelect"></select>
  <select id="stateSelect">
    <option value="On">On</option>
    <option value="Off">Off</option>
  </select>
  <button id="sendBtn">Send</button>

  <script>
    // Register correctly using the internal Add-In ID
    geotab.addin["ioxCaska"] = (function () {

      let apiRef;
      let stateRef;

      function initialize(api, state) {
        apiRef = api;
        stateRef = state;

        const deviceSelect = document.getElementById("deviceSelect");
        const stateSelect = document.getElementById("stateSelect");
        const sendBtn = document.getElementById("sendBtn");

        // Load devices
        api.call("Get", { typeName: "Device" }, function (devices) {
          devices.forEach(device => {
            const opt = document.createElement("option");
            opt.value = device.id;
            opt.textContent = device.name;
            deviceSelect.appendChild(opt);
          });
        });

        // Send command
        sendBtn.onclick = function () {
          const deviceId = deviceSelect.value;
          const onState = stateSelect.value === "On";

          api.call("Set", {
            typeName: "Output",
            entity: {
              device: { id: deviceId },
              data: onState
            }
          }, function () {
            alert("Command sent successfully");
          });
        };
      }

      return {
        focus: initialize
      };

    })();
  </script>

</body>
</html>
