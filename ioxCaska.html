<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IOX Caska</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px 0 0 80px; /* más espacio arriba e izquierda */
    }
    .title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="title">IOX Caska</div>

  <p>This Add-In demonstrates the capabilities of the IOX-OUTPUT.</p>
  <p>Select a vehicle and IOX state and then hit "send" to send a message to the device.</p>

  <select id="deviceSelect"></select>
  <select id="stateSelect">
    <option value="On">On</option>
    <option value="Off">Off</option>
  </select>
  <button id="sendBtn">Send</button>

  <script>
    (function () {

      function createAddin(api, state) {
        return {
          initialize: function (api, state, callback) {
            var deviceSelect = document.getElementById("deviceSelect");
            var stateSelect = document.getElementById("stateSelect");
            var sendBtn = document.getElementById("sendBtn");

            // Cargar vehículos
            api.call("Get", { typeName: "Device" }, function (devices) {
              devices.forEach(function (device) {
                var opt = document.createElement("option");
                opt.value = device.id;
                opt.textContent = device.name;
                deviceSelect.appendChild(opt);
              });

              // Avisar a Geotab que terminó la inicialización
              callback();
            }, function (error) {
              console.error("Error loading devices:", error);
              callback(error);
            });

            // Enviar comando IOX
            sendBtn.onclick = function () {
              var deviceId = deviceSelect.value;
              var onState = (stateSelect.value === "On");

              api.call("Set", {
                typeName: "Output",
                entity: {
                  device: { id: deviceId },
                  data: onState
                }
              }, function () {
                alert("Command sent successfully.");
              }, function (error) {
                console.error("Error sending command:", error);
                alert("Error sending command, see console.");
              });
            };
          },

          focus: function (api, state) {},
          blur: function (api, state) {}
        };
      }

      // Registramos el mismo add-in con DOS nombres posibles
      // para asegurarnos de coincidir con lo que usa MyGeotab.
      geotab.addin.ioxOutput = createAddin;
      geotab.addin["IOX Caska"] = createAddin;

    })();
  </script>

</body>
</html>
