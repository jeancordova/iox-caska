<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IOX Caska</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            margin-bottom: 10px;
        }
        select, button {
            margin-right: 10px;
        }
        .log {
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>IOX Caska - Control Real</h1>

<p>Seleccione un vehículo y el estado del relevador</p>

<select id="deviceSelect"></select>

<select id="stateSelect">
    <option value="ON">ON</option>
    <option value="OFF">OFF</option>
</select>

<button id="sendBtn">Send</button>

<div class="log" id="log"></div>

<script>
geotab.addin.ioxCaska = function (api, state) {

    return {

        initialize: function (api, state, callback) {

            var deviceSelect = document.getElementById("deviceSelect");
            var stateSelect = document.getElementById("stateSelect");
            var sendBtn = document.getElementById("sendBtn");
            var log = document.getElementById("log");

            // Cargar dispositivos
            api.call("Get", { typeName: "Device" }, function (devices) {

                devices.forEach(function (device) {
                    var option = document.createElement("option");
                    option.value = device.id;
                    option.textContent = device.name;
                    deviceSelect.appendChild(option);
                });

                callback();

            }, function (error) {
                console.error(error);
                callback(error);
            });

            // Enviar señal REAL
            sendBtn.onclick = function () {

                var deviceId = deviceSelect.value;
                var value = stateSelect.value;

                api.call("Add", {
                    typeName: "CustomData",
                    entity: {
                        device: { id: deviceId },
                        name: "IOX_CASKA",
                        value: value
                    }
                }, function () {

                    var now = new Date();
                    var entry = document.createElement("div");
                    entry.textContent = "Comando enviado: " + value + " - " + now.toString();
                    log.appendChild(entry);

                }, function (error) {
                    console.error(error);
                    alert("Error al enviar");
                });
            };
        },

        focus: function () {},
        blur: function () {}

    };
};
</script>

</body>
</html>
